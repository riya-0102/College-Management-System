<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <!-- HTML/admin.html => go one level up -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-body">

  <!-- Top Header -->
  <header class="dashboard-header">
    <h1>Admin Dashboard</h1>
    <button class="logout-btn" onclick="window.location.href='../index.html'">
      Logout
    </button>
  </header>

  <!-- Dashboard Cards -->
  <section class="dashboard-container">

    <div class="dash-card students">
      <h2>🎓 Manage Students</h2>
      <p>Add, update and remove student records</p>
      <button>Open</button>
    </div>

    <div class="dash-card faculty">
      <h2>👨‍🏫 Manage Faculty</h2>
      <p>Add faculty details and assign courses</p>
      <button>Open</button>
    </div>

    <div class="dash-card courses">
      <h2>📚 Manage Courses</h2>
      <p>Create, update and delete courses</p>
      <button>Open</button>
    </div>

    <div class="dash-card reports">
      <h2>📊 View Reports</h2>
      <p>Attendance, results and performance reports</p>
      <button>Open</button>
    </div>

  </section>

  <!-- optional but recommended -->
  <script src="../js/app.js"></script>

</body>
</html>
